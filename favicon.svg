<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>

  <!-- Subtle Inner Glass Glow -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Architectural House Silhouette -->
  <!-- Roof Top Peak -->
  <path d="M15 32.5L32 17L49 32.5" stroke="url(#roofGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)"/>
  
  <!-- Chimney / Smart Growth Bar -->
  <path d="M41 23V17H45V26.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- House Body Walls -->
  <path d="M21 29.5V45C21 46.1 21.9 47 23 47H41C42.1 47 43 46.1 43 45V29.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Center Verified / Calculate Badge with Shield Check -->
  <circle cx="32" cy="38" r="7.5" fill="#ffffff" filter="url(#softShadow)"/>
  <circle cx="32" cy="38" r="6" fill="url(#badgeGrad)"/>
  <!-- Checkmark -->
  <path d="M29 38L31.2 40.2L35.2 36" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top Right Spark / Dynamic Pulse -->
  <circle cx="48" cy="16" r="2.5" fill="#fbbf24"/>
</svg>
